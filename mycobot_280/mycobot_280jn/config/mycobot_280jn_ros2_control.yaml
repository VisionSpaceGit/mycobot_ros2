controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint1_to_joint2
      - joint2_to_joint3
      - joint3_to_joint4
      - joint4_to_joint5
      - joint5_to_joint6
      - joint6_to_joint6output
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity